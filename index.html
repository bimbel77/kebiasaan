<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Kebiasaan Anak Indonesia Hebat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav id="navbar" class="navbar navbar-dark bg-primary mb-4 d-none">
    <div class="container">
      <span class="navbar-brand mb-0 h1" id="navBrand">7 Kebiasaan Anak Indonesia Hebat</span>
      <div class="d-flex align-items-center">
        <span class="text-white me-3" id="userInfo"></span>
        <button class="btn btn-outline-light btn-sm" id="btnLogout">Keluar</button>
      </div>
    </div>
  </nav>

  <div class="container">

    <!-- 1. HALAMAN LOGIN -->
    <div id="sectionLogin" class="row justify-content-center py-5">
      <div class="col-md-4">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h4 class="text-center text-primary fw-bold mb-3">7 Kebiasaan Anak Indonesia Hebat</h4>
            <p class="text-center text-muted small mb-4">Masuk menggunakan Akun / NISN</p>
            <div id="loginAlert" class="alert alert-danger d-none p-2 small"></div>
            <form id="formLogin">
              <div class="mb-3">
                <label class="form-label">Username / NISN</label>
                <input type="text" id="loginUsername" class="form-control" required placeholder="Contoh: admin / nisn">
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Masuk</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. DASHBOARD ADMIN -->
    <div id="sectionAdmin" class="d-none">
      <div class="row">
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm">
            <div class="card-header bg-white fw-bold">Pengaturan Sekolah</div>
            <div class="card-body">
              <form id="formSekolah">
                <div class="mb-2">
                  <label class="form-label small">Nama Sekolah</label>
                  <input type="text" id="namaSekolah" class="form-control" required>
                </div>
                <div class="mb-2">
                  <label class="form-label small">Alamat</label>
                  <textarea id="alamatSekolah" class="form-control" required></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label small">Kepala Sekolah</label>
                  <input type="text" id="kepalaSekolah" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success btn-sm w-100">Simpan Pengaturan</button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-md-8">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <span class="fw-bold">Daftar Guru / Wali Kelas</span>
              <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalTambahGuru">+ Tambah Guru</button>
            </div>
            <div class="card-body">
              <table class="table table-bordered align-middle">
                <thead>
                  <tr><th>No</th><th>Nama Lengkap</th><th>Username</th><th>Kelas Ampuan</th></tr>
                </thead>
                <tbody id="tabelGuru"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. DASHBOARD GURU -->
    <div id="sectionGuru" class="d-none">
      <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h5 class="mb-0 fw-bold" id="titleKelasGuru">Pemantauan Kelas</h5>
          <div class="d-flex gap-2">
            <button class="btn btn-warning btn-sm" onclick="cetakKartuLogin()">Cetak Kartu Login</button>
            <button class="btn btn-info btn-sm text-white" onclick="cetakRekapHarian()">Cetak Rekap Harian</button>
            <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#modalTambahSiswa">+ Tambah Siswa</button>
          </div>
        </div>
        <div class="card-body">
          <table class="table table-striped align-middle">
            <thead>
              <tr><th>No</th><th>NISN</th><th>Nama Siswa</th><th>Status Kebiasaan Hari Ini</th></tr>
            </thead>
            <tbody id="tabelSiswaGuru"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 4. DASHBOARD SISWA -->
    <div id="sectionSiswa" class="d-none">
      <div class="alert alert-primary text-center fw-bold mb-4" id="tglHariIni"></div>
      <div class="row g-3" id="container7Kebiasaan"></div>
    </div>

  </div>

  <!-- AREA PRINT (Hidden dari layar utama) -->
  <div id="printArea" class="d-none"></div>

  <!-- MODAL TAMBAH GURU -->
  <div class="modal fade" id="modalTambahGuru" tabindex="-1">
    <div class="modal-dialog">
      <form id="formTambahGuru" class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Tambah Guru</h5></div>
        <div class="modal-body">
          <div class="mb-2"><label class="form-label">Nama Lengkap</label><input type="text" id="guruNama" class="form-control" required></div>
          <div class="mb-2"><label class="form-label">Kelas Ampuan</label><input type="text" id="guruKelas" class="form-control" placeholder="Contoh: 1A" required></div>
          <div class="mb-2"><label class="form-label">Username</label><input type="text" id="guruUsername" class="form-control" required></div>
          <div class="mb-2"><label class="form-label">Password</label><input type="password" id="guruPassword" class="form-control" required></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary">Simpan</button></div>
      </form>
    </div>
  </div>

  <!-- MODAL TAMBAH SISWA -->
  <div class="modal fade" id="modalTambahSiswa" tabindex="-1">
    <div class="modal-dialog">
      <form id="formTambahSiswa" class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Tambah Siswa</h5></div>
        <div class="modal-body">
          <div class="mb-2"><label class="form-label">NISN (Sekaligus Username & Password)</label><input type="text" id="siswaNisn" class="form-control" required></div>
          <div class="mb-2"><label class="form-label">Nama Lengkap Siswa</label><input type="text" id="siswaNama" class="form-control" required></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-success">Simpan</button></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
