<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurnal 7 Kebiasaan Anak Indonesia Hebat</title>
  
  <!-- BOOTSTRAP 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- BOOTSTRAP ICONS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* Styling khusus sidebar gaya Dapodik */
    body {
      background-color: #f4f6f9;
    }
    .sidebar-dapodik {
      background-color: #212529;
      min-height: calc(100vh - 48px);
    }
    .sidebar-dapodik .nav-link {
      color: #c2c7d0;
      border-radius: 4px;
      padding: 10px 15px;
    }
    .sidebar-dapodik .nav-link.active {
      background-color: #0d6efd;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- KODE SECTION SISWA (Sesuai kode sebelumnya) -->
  <div id="sectionSiswa" class="d-none">
    <!-- Top Header Bar -->
    <div class="d-flex justify-content-between align-items-center bg-primary text-white px-3 py-2 shadow-sm">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-list fs-4"></i>
        <span class="fw-bold fs-6">JURNAL 7 KEBIASAAN ANAK INDONESIA HEBAT</span>
      </div>
      <div class="small d-flex align-items-center">
        <span id="headerSiswaNama" class="fw-semibold me-3">Siswa</span>
        <button id="btnLogout" class="btn btn-sm btn-outline-light">Keluar</button>
      </div>
    </div>

    <div class="container-fluid p-0">
      <div class="row g-0">
        
        <!-- Sidebar Kiri -->
        <div class="col-md-3 col-lg-2 sidebar-dapodik p-3 d-flex flex-column justify-content-between">
          <div>
            <!-- Widget Profil Siswa -->
            <div class="text-center pb-3 mb-3 border-bottom border-secondary">
              <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                <i class="bi bi-person-fill fs-1 text-white"></i>
              </div>
              <h6 id="sidebarSiswaNama" class="mb-0 fw-bold text-white text-uppercase">Nama Siswa</h6>
              <small class="text-warning d-block">Siswa Aktif</small>
              <small id="sidebarSiswaKelas" class="text-muted">Kelas -</small>
            </div>

            <!-- Menu Sidebar -->
            <ul class="nav nav-pills flex-column gap-1">
              <li class="nav-item">
                <a href="#" class="nav-link active d-flex align-items-center gap-2">
                  <i class="bi bi-journal-check"></i> Riwayat Kebiasaan
                </a>
              </li>
            </ul>
          </div>

          <div class="small text-muted text-center pt-3 border-top border-secondary">
            Versi Aplikasi 2026.1
          </div>
        </div>

        <!-- Konten Utama Kanan -->
        <div class="col-md-9 col-lg-10 p-4">
          
          <div class="d-flex justify-content-between align-items-center mb-3 bg-white p-3 rounded shadow-sm">
            <div>
              <h5 class="mb-0 text-primary fw-bold"><i class="bi bi-table me-2"></i>Riwayat Pengisian Kebiasaan</h5>
              <small class="text-muted">Daftar kegiatan jurnal harian 7 kebiasaan yang telah diisi</small>
            </div>
            <button class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#modalTambahJurnal">
              <i class="bi bi-plus-circle me-1"></i> + Tambah Kegiatan Kebiasaan
            </button>
          </div>

          <!-- Tabel Riwayat -->
          <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                  <thead class="table-dark">
                    <tr>
                      <th>No</th>
                      <th>Tanggal</th>
                      <th>Nama Kebiasaan</th>
                      <th>Rincian / Catatan</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="tabelRiwayatKebiasaan">
                    <!-- Data riwayat dari JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT BOOTSTRAP JS (Wajib ditaruh sebelum tag </body>) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SCRIPT APLIKASI -->
  <script type="module" src="app.js"></script>
</body>
</html>
