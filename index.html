<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Kebiasaan Anak Indonesia Hebat</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Container Utama -->
    <div class="app-container" id="appContainer">
        
        <!-- Sidebar Kiri -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <i class="fa-solid fa-graduation-cap"></i>
                <h2>Anak Hebat</h2>
            </div>
            
            <div class="user-profile-summary">
                <p id="userRoleBadge" class="badge">Guest</p>
                <h4 id="userNameDisplay">Silakan Login</h4>
            </div>

            <nav class="nav-menu" id="navMenu">
                <!-- Navigasi akan diisi secara dinamis oleh JavaScript sesuai Role -->
            </nav>

            <button class="btn-logout" id="btnLogout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <h1 id="pageTitle">Dashboard</h1>
            </header>

            <section class="content-body" id="contentBody">
                <!-- Konten Halaman akan Berganti Secara Dinamis -->
            </section>
        </main>
    </div>

    <!-- Firebase SDK (Modular CDN v10+) -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
