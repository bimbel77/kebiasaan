<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Kebiasaan Anak Indonesia Hebat</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Modal Login -->
    <div id="loginModal" class="login-modal" style="display: flex;">
        <div class="login-card">
            <h2><i class="fa-solid fa-graduation-cap"></i> Portal Masuk</h2>
            <p>Pilih Akses Masuk Aplikasi</p>
            
            <div class="form-group" style="margin-top: 15px;">
                <label>Masuk Sebagai:</label>
                <select id="roleSelect" onchange="toggleLoginFields()">
                    <option value="siswa">Siswa</option>
                    <option value="guru">Guru</option>
                    <option value="admin">Admin Sekolah</option>
                </select>
            </div>

            <div class="form-group">
                <label id="identityLabel">Nama Siswa / NISN:</label>
                <input type="text" id="usernameInput" placeholder="Masukkan nama..." required>
            </div>

            <div class="form-group" id="passGroup" style="display: none;">
                <label>Password:</label>
                <input type="password" id="passwordInput" placeholder="Masukkan password...">
            </div>

            <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="prosesLogin()">Masuk Aplikasi</button>
        </div>
    </div>

    <!-- Container Utama App -->
    <div class="app-container" id="appContainer" style="display: none;">
        
        <!-- Sidebar Kiri -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <i class="fa-solid fa-graduation-cap"></i>
                <h2>Anak Hebat</h2>
            </div>
            
            <div class="user-profile-summary">
                <span id="userRoleBadge" class="badge">Siswa</span>
                <h4 id="userNameDisplay" style="margin-top: 5px;">-</h4>
            </div>

            <nav class="nav-menu" id="navMenu">
                <!-- Navigasi Dinamis -->
            </nav>

            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <h1 id="pageTitle">Dashboard</h1>
            </header>

            <section class="content-body" id="contentBody">
                <!-- Konten Halaman Dinamis -->
            </section>
        </main>
    </div>

    <!-- Firebase SDK (Modular CDN) -->
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
